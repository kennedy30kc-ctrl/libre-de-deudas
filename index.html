<style>

@keyframes grow{from{transform:scaleX(0)}}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sh{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 26px;text-align:center;animation:slide .3s both}

.mood{font-size:66px;animation:pop .6s both}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);box-shadow:0 -4px 18px rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom);z-index:10}

<script>
const K='libreDeudas3';
const def={setup:false,name:'',g:'f',cur:'$',job:'delivery',inc:'variable',sal:0,adv:false,freq:'mensual',method:'bola',fun:10,pct:5,avail:0,fundBal:0,funBal:0,pend:0,paidTot:0,lastInc:0,lastYm:'',v2:0,rentDay:0,payDays:[],paidM:{},spent:{},dpm:{},late:[],log:[],exp:[],mig:0,fix:{trabajo:0,basicos:0,alquiler:0},debts:[],hist:[],used:{}};
let S;try{S=Object.assign(JSON.parse(JSON.stringify(def)),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=JSON.parse(JSON.stringify(def))}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const FAC={semanal:.25,quincenal:.5,mensual:1};
const JOB={delivery:'Moto (gasolina y mantenimiento)',empleado:'Transporte al trabajo',independiente:'Herramientas y materiales',otro:'Gastos del trabajo'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>esc(S.cur)+Math.round(n).toLocaleString('es');
const fr=n=>S.cur+Math.round(n).toLocaleString('es');
function mk(){return 'e'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function icon(n){n=String(n).toLowerCase();const m=[[/alquil|arriend/,'🏠'],[/luz|electric/,'💡'],[/agua/,'🚿'],[/internet|wifi/,'📶'],[/celular|plan |móvil|movil|teléfono|telefono/,'📱'],[/merca|comida|aliment|servicios b/,'🍽️'],[/gasolina|moto|transporte|bus|carro|taxi/,'🛵'],[/herramient|material/,'🧰'],[/colegio|escuela|universidad|curso/,'🎓'],[/gas\b/,'🔥'],[/netflix|stream|spotify|música|musica|suscrip|disney|youtube/,'🎬'],[/gimnasio|gym/,'🏋️']];
for(const x of m)if(x[0].test(n))return x[1];return '🧾'}
function migrate(){if(S.mig)return;S.exp=S.exp||[];
if(S.fix.trabajo>0)S.exp.push({id:mk(),n:JOB[S.job],amt:S.fix.trabajo,type:'ess',apt:false,day:0,paused:false,until:null});
if(S.fix.basicos>0)S.exp.push({id:mk(),n:'Comida y servicios básicos',amt:S.fix.basicos,type:'ess',apt:false,day:0,paused:false,until:null});
if(S.fix.alquiler>0)S.exp.push({id:mk(),n:'Alquiler',amt:S.fix.alquiler,type:'ess',apt:false,day:S.rentDay||0,paused:false,until:null});
(S.paus||[]).forEach(p=>S.exp.push({id:mk(),n:p.n,amt:p.amt,type:'pau',apt:false,day:0,paused:!!p.paused,until:p.until||null}));
S.mig=1;save()}
migrate();
function migrate2(){if(S.v2)return;if(S.pend>0){S.avail-=S.pend;S.pend=0}S.todo=[];S.gap=[];S.sav={};S.v2=1;save()}
migrate2();
S.late.forEach(l=>{if(!l.id)l.id=mk()});

const F={
abrir:[
"Hola, {n}. Hoy es un buen día para dar un paso, por pequeño que sea. 💛",
"No tienes que arreglarlo todo hoy. Solo seguir avanzando.",
"Cada día que abres esta app es un día que eliges tu libertad, {n}.",
"Estás más cerca de lo que crees. Sigue.",
"Tu esfuerzo de cada día vale mucho. Vamos a cuidarlo.",
"Quien se atreve a mirar sus deudas de frente ya ganó la mitad de la batalla.",
"Un paso a la vez. Hoy toca uno más.",
"Eres más fuerte que tus deudas, {n}. Y vas a demostrarlo.",
"Qué bueno verte por aquí. Tu tranquilidad se construye con días como hoy.",
"No estás {s} en esto. Aquí estoy para ayudarte a ordenar todo.",
"Pequeñas decisiones, grandes cambios. Hoy tú decides.",
"Respira. Tienes un plan, y el plan funciona si lo sigues."],
ingreso:[
"¡Entró dinero, {n}! Ahora tú decides cómo usarlo. 💪",
"Eso es trabajo duro convertido en libertad. Úsalo con cabeza.",
"Cada peso que entra es una herramienta. Usémosla con inteligencia.",
"Qué orgullo ver tu esfuerzo. Ahora a pagar con calma.",
"Buen trabajo. Ahora lo importante: que cada peso haga su parte.",
"Lo ganaste tú. Ahora que trabaje para ti.",
"Cobro registrado. Mira tu mes y marca lo que vayas pagando.",
"Tu esfuerzo merece un buen plan. Aquí lo tienes."],
extra:[
"🎁 ¡Qué buena noticia, {n}! Un dinero extra es un empujón para tu libertad.",
"Esto es un regalo del esfuerzo. Vamos a usarlo con cabeza.",
"Dinero extra recibido. Cada peso de más acorta el camino.",
"Qué bien, {n}. Lo inesperado también puede ayudarte a avanzar.",
"Un empujón extra. Hagamos que rinda al máximo.",
"No se gasta, se invierte en tu tranquilidad."],
pago:[
"¡Lo lograste, {n}! Cada pago te acerca a tu libertad. 🎉",
"Pago hecho. Hoy le ganaste un pedazo a tus deudas.",
"Eso es disciplina. Qué orgullo tu constancia.",
"Un pago más. Así se construye la libertad, paso a paso.",
"Cumpliste con tu responsabilidad y eso dice mucho de ti.",
"Mira lo que hiciste hoy: tu deuda es más pequeña que ayer.",
"Cada pago es un voto de confianza en tu futuro. Bien hecho.",
"Sigue así, {n}. La constancia es tu mejor arma.",
"Lo que parecía imposible se está volviendo realidad.",
"Te mereces sentirte {o} de este avance."],
atraso:[
"Un mes difícil le pasa a cualquiera, {n}. Lo importante es que seguimos. 💛",
"Atrasarse no te define. Retomar sí. Ya quedó anotado.",
"No pasa nada. Hoy es un buen día para volver a empezar.",
"Esto es un tropiezo, no el final. Levántate, que tú puedes.",
"No te castigues. Respira, ordena y da el siguiente paso.",

"Aunque hoy no se pudo, mañana es otra oportunidad. Aquí sigo contigo.",
"Lo importante es que no te rindes. Retomemos con calma.",
"Un atraso se arregla. Lo que no se arregla es rendirse, y tú no te rindes.",
"Sigue. Un pequeño pago hoy vale más que un gran pago nunca."],
hito:[
"🏆 ¡UNA DEUDA MENOS, {n}! Esto merece celebrarse.",
"🎉 Deuda saldada. Mira todo lo que has avanzado.",
"¡Libre de esa deuda! Una carga menos sobre tus hombros.",
"Eso que parecía imposible ya está hecho. Orgullo total. 🙌",
"¡Cerraste una deuda! Ahora ese dinero se libera para la siguiente.",
"Lo hiciste. Respira hondo y disfrútalo, te lo ganaste.",
"Una victoria más. Cada deuda saldada te acerca a la libertad total.",
"¡Increíble constancia! Una deuda menos y muchas ganas de más."],
imprevisto:[
"Los imprevistos pasan, {n}. Para eso estamos preparados. 💪",
"Esto no te tumba. Lo cubrimos y seguimos.",
"Un imprevisto no borra tu progreso. Ajustamos y continuamos.",
"Respira. Para momentos como este existe tu fondo.",
"Lo importante es que lo registraste y no lo escondiste. Eso es madurez.",
"Nadie se libra de las sorpresas. Tú ya tienes un plan para ellas.",
"Esto es un bache, no el final del camino.",
"Con calma, {n}. Lo vamos resolviendo paso a paso."],
nueva:[
"Gracias por registrarla, {n}. Ver todo claro es lo que nos permite ganarle.",
"Una deuda nueva se ordena igual que las demás. Ya quedó en el plan.",
"Mejor tenerla a la vista que escondida. Buen paso.",
"Tu plan se ajustó. Seguimos avanzando.",
"Registrarla toma valentía. Eso es lo que cambia las cosas.",
"Todo queda ordenado otra vez. Tú sigue."],
fondo:[
"🎉 ¡Llegaste a la meta de tu fondo de emergencia, {n}! Ahora tienes un colchón para los imprevistos.",
"Meta del fondo cumplida. Ya puedes mandar todo el extra a tus deudas. 🙌",
"Mira lo que lograste: ya estás {c} ante una sorpresa. Sigue con tus deudas.",
"¡Fondo completo! Dormir más tranquilo también es progreso.",
"Lo lograste. Ahora todo el esfuerzo extra va a ganarle a las deudas."],
pausa:[
"Pausar no es rendirse, {n}: es cuidar lo importante primero. 💛",
"Buena decisión. Esa plata ahora trabaja para tu libertad.",
"Es solo por un tiempo. Cuando estés mejor, lo retomamos.",
"Cuidar lo esencial primero es de personas sabias."]};

function fmtMsg(t){return t.replace(/\{n\}/g,esc(S.name||'amigo')).replace(/\{o\}/g,S.g=='m'?'orgulloso':'orgullosa').replace(/\{s\}/g,S.g=='m'?'solo':'sola').replace(/\{c\}/g,S.g=='m'?'cubierto':'cubierta')}
function pick(c){const a=F[c];let u=S.used[c]||[];let o=a.map((_,i)=>i).filter(i=>!u.includes(i));
if(!o.length){u=[];o=a.map((_,i)=>i)}
const i=o[Math.floor(Math.random()*o.length)];u.push(i);S.used[c]=u;save();return fmtMsg(a[i])}let tab='inicio',sub='deudas',msg=null,imp=null,dm=null,boom=false,sheet=null,openLog=null;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const FAR=new Date(2999,0,1);
const ka=k=>typeof k=='string'?"'"+k+"'":k;
const gv=id=>document.getElementById(id).value;
const goal=()=>S.exp.filter(e=>e.type=='ess').reduce((s,e)=>s+e.amt,0)/4;
const pausAct=()=>S.exp.filter(e=>e.type=='pau'&&!e.paused);
const pausSum=()=>pausAct().reduce((s,e)=>s+e.amt,0);
const need=()=>S.exp.filter(e=>!e.paused).reduce((s,e)=>s+e.amt,0)+S.debts.filter(d=>d.bal>0).reduce((s,d)=>s+d.min,0);
const SUG=[['Alquiler','ess'],['Luz','ess'],['Agua','ess'],['Internet','ess'],['Celular','ess'],['Gas','ess'],['Colegio','ess'],['Mercado y comida','ess'],['Gasolina o transporte','ess'],['Streaming (Netflix, etc.)','pau'],['Gimnasio','pau']];
const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const strip=n=>String(n).replace(/^\S+\s/,'');
const monthName=ym=>{const p=ym.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('es',{month:'long'})};
function addLog(o){S.log.push(o);if(S.log.length>300)S.log.shift()}
function applyDebt(d,amt){const a=Math.min(amt,d.bal);d.bal-=a;S.paidTot+=a;const ym=ymOf(new Date());S.dpm[ym]=(S.dpm[ym]||0)+a;if(d.bal<=0.5){d.bal=0;return true}return false}
function netHour(){const a=S.hist.filter(x=>x.h>0).slice(-4);if(a.length<3)return null;const h=a.reduce((s,x)=>s+x.h,0),n=a.reduce((s,x)=>s+x.inc-(x.g||0),0);return n/h}
function occ(day,after){const t=new Date();t.setHours(0,0,0,0);if(after)t.setDate(t.getDate()+1);
const m2=(y,m)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
let d=m2(t.getFullYear(),t.getMonth());if(d<t)d=m2(t.getFullYear(),t.getMonth()+1);return d}
function daysTo(d){const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function nextPayDate(){if(!S.payDays.length)return null;let b=null;S.payDays.forEach(p=>{const d=occ(p,true);if(!b||d<b)b=d});return b}
function cobroInfo(){const m=S.payDays.length;if(!m)return null;const mm=ymOf(new Date());const done=S.hist.filter(h=>!h.ex&&ymOf(new Date(h.t))==mm).length;return{n:Math.min(done+1,m),m,done}}

function roll(){const cur=ymOf(new Date());if(!S.lastYm){S.lastYm=cur;save();return}
if(S.lastYm==cur)return;const pm=S.paidM[S.lastYm]||{};
S.exp.filter(e=>!e.paused&&e.day>0&&e.amt>0&&!pm[e.id]).forEach(e=>{S.late.push({id:mk(),n:e.n,amt:e.amt,key:e.id,ym:S.lastYm});addLog({t:Date.now(),type:'atraso',amt:e.amt,why:'Venció sin marcar: '+e.n,lines:[]})});
S.debts.filter(d=>d.bal>0&&d.min>0&&!pm[d.id]).forEach(d=>{const a=Math.min(d.min,d.bal);S.late.push({id:mk(),n:d.n,amt:a,debtId:d.id,key:d.id,ym:S.lastYm});addLog({t:Date.now(),type:'atraso',amt:a,why:'Venció sin marcar: '+d.n,lines:[]})});
S.lastYm=cur;save()}

function items(){const now=new Date();now.setHours(0,0,0,0);const ym=ymOf(now),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
const pm=S.paidM[ym]||{},sp=S.spent[ym]||{},fix=[],bud=[];
S.exp.filter(e=>!e.paused&&e.amt>0).forEach(e=>{
if(e.day>0)fix.push({key:e.id,n:icon(e.n)+' '+e.n,amt:e.amt,day:e.day,due:new Date(now.getFullYear(),now.getMonth(),Math.min(e.day,dim)),paid:pm[e.id],debt:null});
else bud.push({key:e.id,n:icon(e.n)+' '+e.n,amt:e.amt,spent:sp[e.id]||0})});
S.debts.filter(d=>d.min>0&&(d.bal>0||pm[d.id])).forEach(d=>{const paid=pm[d.id];
fix.push({key:d.id,n:'💳 '+d.n+' (cuota)',amt:(paid&&paid.a)?paid.a:(d.bal>0?Math.min(d.min,d.bal):d.min),day:d.day||0,due:d.day>0?new Date(now.getFullYear(),now.getMonth(),Math.min(d.day,dim)):null,paid,debt:d})});
return{ym,now,dim,fix,bud}}

function ctx(){const I=items(),np=nextPayDate(),end=np||FAR;
const dl=f=>f.due||FAR;
const pend=I.fix.filter(f=>!f.paid).sort((a,b)=>dl(a)-dl(b));
const win=pend.filter(f=>!f.due||f.due<end);
const wd=np?Math.max(1,daysTo(np)):Math.max(1,I.dim-I.now.getDate()+1);
const fr2=Math.min(1,wd/30);
let run=S.avail;const fit=[],nofit=[];
const seq=[...S.late.map((l,i)=>({late:i,n:'⏰ '+l.n,amt:l.amt})),...win.map(f=>({key:f.key,n:f.n,amt:f.amt,due:f.due}))];
seq.forEach(x=>{if(run>=x.amt-0.5){fit.push(x);run-=x.amt}else nofit.push(x)});
const budRes=I.bud.reduce((s,b)=>s+Math.max(0,b.amt-b.spent)*fr2,0);
return{I,np,pend,win,seq,fit,nofit,run,budRes,free:run-budRes}}

function tips(hole){const nh=S.adv?netHour():null;let ganar;
if(S.job=='delivery')ganar='Trabajar en horas pico (almuerzo y cena), fines de semana o con más de una plataforma. Ojo: más horas solo sirven si cada hora te deja ganancia después de la gasolina.';
else if(S.job=='independiente')ganar='Ofrecer tu servicio a más clientes y revisar si estás cobrando lo que vale tu tiempo.';
else ganar='Horas extra si tu trabajo las permite, un trabajo extra de fin de semana o vender algo que ya no uses.';
if(S.adv){ganar+=nh===null?' Aún no tengo datos suficientes para decirte si las horas extra te convienen: sigue registrando horas y gasto de trabajo.':(nh>0?' Tus últimas horas te dejaron en promedio '+fm(nh)+' netos por hora.':' Tus últimas horas casi no te dejaron ganancia neta, así que conviene recortar antes que trabajar más.')}
const pa=pausAct(),ng=S.debts.filter(d=>d.neg&&d.bal>0);
const pz=pa.length?'<p><b>⏸️ Pausar por ahora:</b> '+pa.map(p=>esc(p.n)+' ('+fm(p.amt)+')').join(', ')+'. Pausarlos liberaría '+fm(pausSum())+' al mes.</p><div class="ar">'+pa.map(p=>'<button class="mini p" onclick="pauseIt('+ka(p.id)+',1)">Pausar '+esc(p.n)+' 1 mes</button>').join('')+'</div><p class="m">Si prefieres 2 meses, cámbialo en Deudas, en Gastos fijos.</p>':'';
const nz=ng.length?'<p><b>🤝 Renegociar:</b> '+ng.map(d=>esc(d.n)).join(', ')+'. Pide una cuota menor o más plazo. Mientras tanto, la cuota actual sigue siendo obligatoria.</p>':'';

delete S.paidM[ym][key];save();render(true)}
function spend(key){const I=items(),b=I.bud.find(x=>String(x.key)==String(key));if(!b)return;const rem=Math.max(0,b.amt-b.spent);

addLog({t:Date.now(),type:'pago',amt:a,why:'',lines:[{n:'🛒 Gasto: '+strip(b.n),a}]});save();msg=pick('pago');render(true)}
function payLate(i){const l=S.late[i];if(!l)return;let cl=false;

else{const d=S.debts.find(q=>q.id==id);if(!d)return;amt=Math.min(amt,Math.round(d.bal));cl=applyDebt(d,amt);nm='🎯 Extra a '+d.n}
S.avail-=amt;addLog({t:Date.now(),type:'pago',amt,why:'',lines:[{n:nm,a:amt}]});
save();msg=pick(cl?'hito':hit?'fondo':'pago');boom=cl||hit;render(true)}

function leftover(C){const free=C.free;if(!(free>0.5))return '';
const g=goal();let fs=Math.min(Math.max(0,g-S.fundBal),Math.round(S.lastInc*S.pct/100),free);fs=Math.max(0,Math.round(fs));
const rest=free-fs,fu=Math.round(rest*S.fun/100),ex=Math.max(0,rest-fu);
const tg=S.debts.filter(d=>d.bal>0&&(d.type||'tar')=='tar').sort((a,b)=>S.method=='bola'?a.bal-b.bal:b.rate-a.rate)[0];
const ea=tg?Math.min(Math.round(ex),Math.round(tg.bal)):0;
const rows=[];
if(fs>0)rows.push(['🛟 Apartar al fondo de emergencia',fs,"moveTo('fund',"+fs+")"]);
if(fu>0)rows.push(['🎈 Apartar para tu diversión',fu,"moveTo('fun',"+fu+")"]);
if(ea>0)rows.push(['🎯 Pagar extra a '+esc(tg.n)+' (bola de nieve)',ea,"moveTo('debt',"+ea+","+tg.id+")"]);
if(!rows.length)return '';
return '<p>Cuando cubras lo que viene, te sobran <b>'+fm(free)+'</b>. Te sugiero:</p>'+rows.map(r=>'<div class="row"><span>'+r[0]+'<div class="m">'+fm(r[1])+'</div></span><button class="mini p" onclick="'+r[2]+'">Hacerlo</button></div>').join('')}

if(S.avail<=0.5&&!inc)return '<div class="card"><b>💡 Mi sugerencia</b><p class="m">Registra tu cobro y te digo con qué pagos empezar.</p><button class="b" onclick="go(\'cobro\')">💰 Registrar cobro</button></div>';
const nx=C.np?'tu próximo cobro (día '+C.np.getDate()+')':'fin de mes';
let h='<div class="card"><b>💡 Mi sugerencia</b>';
if(!C.seq.length)h+='<p class="m">No tienes pagos con fecha pendientes antes de '+nx+'. ¡Bien!</p>';
else{if(C.fit.length)h+='<p>✅ Te alcanza para: <b>'+C.fit.map(x=>esc(strip(x.n))+' ('+fm(x.amt)+')').join(', ')+'</b>.</p>';

const lt=S.late.length?'<div class="card warm tap" onclick="go(\'mes\')"><b>⏰ Tienes '+S.late.length+' pago(s) atrasado(s)</b><div class="m">Toca para verlos en Mi mes.</div></div>':'';

const rowFix=f=>{const od=f.due&&f.due<I.now,when=f.due?(od?'⚠️ Venció el día '+f.day:(daysTo(f.due)==0?'Vence hoy':'Vence el día '+f.day)):'Sin día de pago',nf=nfk.has(String(f.key));

if(I.bud.length)h+='<div class="card"><b>🛒 Gastos sin fecha</b><p class="m">Se gastan poco a poco durante el mes.</p>'+I.bud.map(b=>{const rem=Math.max(0,b.amt-b.spent),pc=Math.min(100,Math.round(b.spent/b.amt*100));return '<div class="row" style="align-items:flex-start"><div style="flex:1"><b>'+esc(b.n)+'</b><div class="m">Llevas '+fm(b.spent)+' de '+fm(b.amt)+'</div><div class="bar"><div style="width:'+pc+'%"></div></div><button class="mini p" onclick="spend('+ka(b.key)+')">Registrar gasto</button></div><b>'+fm(rem)+'</b></div>'}).join('')+'</div>';
const pd=I.fix.filter(f=>f.paid);
if(pd.length)h+='<div class="card"><b>✅ Pagado este mes</b>'+pd.map(f=>'<div class="row"><span>'+esc(f.n)+'</span><span><b class="ok">'+fm(f.amt)+'</b> <button class="x" style="color:var(--p)" onclick="undoFix('+ka(f.key)+')">Deshacer</button></span></div>').join('')+'</div>';
if(!I.fix.length&&!I.bud.length)h+='<div class="card"><p class="m">Aún no tienes gastos fijos ni deudas con cuota. Agrégalos en la pestaña Deudas.</p><button class="b" onclick="go(\'deudas\')">📋 Ir a Deudas</button></div>';
return h}

function vCobro(){const ci=cobroInfo();
return '<h2>💰 Registrar '+(ci?'cobro '+ci.n+' de '+ci.m:'un ingreso')+'</h2><div class="card"><p class="m">Escribe cuánto te llegó. Se suma a tu dinero disponible, y tú decides en qué pagarlo. Ahora tienes: <b>'+fm(S.avail)+'</b>.</p><label>¿Qué es?</label><select id="it"><option value="cobro">Mi cobro normal</option><option value="extra">Dinero extra (trabajo extra, un pago que me debían)</option></select><label>¿Cuánto te llegó?</label><input id="inc" type="number" inputmode="decimal"><label>Motivo (opcional)</label><input id="em" placeholder="Ej. trabajo extra del sábado">'+(S.adv?'<label>Horas trabajadas (opcional)</label><input id="ih" type="number" inputmode="decimal"><label>Gasto de trabajo, ej. gasolina (opcional)</label><input id="ig" type="number" inputmode="decimal">':'')+'<button class="b" onclick="addInc()">Sumar a mi dinero disponible</button></div>'}

function vDebtsPart(){let l=S.debts.map(d=>{const ini=d.ini||d.bal,pc=ini>0?Math.round((1-d.bal/ini)*100):0,ty=(d.type||'tar')=='conv'?'Convenio (cuota fija)':'Tarjeta o préstamo';
return '<div class="row" style="align-items:flex-start"><div style="flex:1"><b>'+esc(d.n)+'</b>'+(d.bal==0?' ✅ Saldada':'')+'<div class="m">'+ty+(d.neg?' · negociable':'')+'</div><div class="m">Debe '+fm(d.bal)+' · cuota '+fm(d.min)+' · interés '+d.rate+'%'+(d.day?' · día '+d.day:' · ⚠️ sin día de pago')+'</div><div class="bar"><div style="width:'+Math.max(0,pc)+'%"></div></div><div class="ar"><button class="mini" onclick="editDay('+d.id+')">Cambiar día</button><button class="mini" onclick="togType('+d.id+')">Cambiar tipo</button><button class="mini" onclick="togNeg('+d.id+')">'+(d.neg?'Quitar negociable':'Marcar negociable')+'</button></div></div><button class="x" onclick="delDebt('+d.id+')">Borrar</button></div>'}).join('');
return (dm?'<div class="card hi">'+dm+'</div>':'')+'<div class="card">'+(l||'<p class="m">Aún no has agregado deudas. Agrega todas, incluso las pequeñas.</p>')+'</div><div class="card"><b>➕ Agregar deuda</b><br><br><label>Nombre (ej. Tarjeta, Convenio, Prestamista)</label><input id="dn"><label>Tipo</label><select id="dt"><option value="tar">Tarjeta o préstamo (recibe el extra de la bola de nieve)</option><option value="conv">Convenio (solo se paga su cuota)</option></select><label>Cuánto debes en total</label><input id="db" type="number" inputmode="decimal"><label>Cuota mínima al mes (obligatoria)</label><input id="dm" type="number" inputmode="decimal"><label>Interés mensual (%)</label><input id="dr" type="number" inputmode="decimal"><label>Día del mes en que se paga la cuota</label><input id="dd" type="number" inputmode="numeric"><label><input id="dg" type="checkbox" style="width:auto;margin-right:8px">Se puede renegociar (solo para sugerencias; la cuota sigue siendo obligatoria)</label><button class="b" onclick="addDebt()">Agregar</button></div>'}

function vGastos(){const te=S.exp.filter(e=>e.type=='ess').reduce((s,e)=>s+e.amt,0),tp=pausSum();
const row=e=>'<div class="row" style="align-items:flex-start"><div style="flex:1"><b>'+icon(e.n)+' '+esc(e.n)+'</b> · '+fm(e.amt)+'/mes<div class="m">'+(e.type=='pau'?(e.paused?'⏸️ Pausado'+(e.until?' hasta el '+new Date(e.until).toLocaleDateString('es',{day:'numeric',month:'short'}):''):'▶️ Se puede pausar'):'Esencial')+(e.day?' · se paga completo el día '+e.day:' · se gasta poco a poco')+'</div><div class="ar"><button class="mini" onclick="editExp('+ka(e.id)+')">Editar monto</button><button class="mini" onclick="editDay('+ka(e.id)+')">Cambiar día</button>'+(e.type=='pau'?(e.paused?'<button class="mini p" onclick="resumeIt('+ka(e.id)+')">Retomar</button>':'<button class="mini" onclick="pauseIt('+ka(e.id)+',1)">Pausar 1 mes</button><button class="mini" onclick="pauseIt('+ka(e.id)+',2)">Pausar 2 meses</button>'):'')+'</div></div><button class="x" onclick="delExp('+ka(e.id)+')">Borrar</button></div>';
const sg=SUG.filter(s=>!S.exp.some(e=>e.n.toLowerCase()==s[0].toLowerCase()));
return '<div class="card"><b>🧾 Mis gastos fijos</b> <button class="x" style="color:var(--p)" onclick="info(\'gastos\')">ⓘ</button><p class="m">Esenciales: '+fm(te)+' al mes'+(tp>0?' · Pausables activos: '+fm(tp):'')+'</p>'+(S.exp.length?S.exp.map(row).join(''):'<p class="m">Aún no has agregado gastos. Agrega todos los que tengas, aunque sean pequeños.</p>')+'</div><div class="card"><b>➕ Agregar gasto fijo</b>'+(sg.length?'<p class="m">Toca uno para empezar más rápido:</p><div class="ar" style="margin-bottom:12px">'+sg.map(s=>'<button class="mini" onclick="sugg(\''+s[0]+'\',\''+s[1]+'\')">+ '+s[0]+'</button>').join('')+'</div>':'')+'<label>Nombre</label><input id="xn"><label>Cuánto cuesta al mes</label><input id="xm" type="number" inputmode="decimal"><label>Tipo</label><select id="xt"><option value="ess">Esencial (no se toca)</option><option value="pau">Se puede pausar si falta plata</option></select><label>Día del mes en que se paga completo (déjalo vacío si se gasta poco a poco, como la comida)</label><input id="xd" type="number" inputmode="numeric"><button class="b" onclick="addExp()">Agregar</button></div>'}

function vDeudas(){const sw='<div class="gr2"><button class="b'+(sub=='deudas'?'':' g')+'" onclick="setSub(\'deudas\')">💳 Deudas</button><button class="b'+(sub=='gastos'?'':' g')+'" onclick="setSub(\'gastos\')">🧾 Gastos fijos</button></div>';
return '<h2>📋 Deudas y gastos</h2>'+sw+(sub=='gastos'?vGastos():vDebtsPart())}

function vImp(){return '<h2>⚠️ Imprevisto</h2><div class="card"><p class="m">Cuéntame cuánto fue. Lo cubro primero con tu sobre de diversión, luego con el fondo de emergencia, y si falta algo sale de tu dinero disponible.</p><label>¿De cuánto fue el gasto?</label><input id="iv" type="number" inputmode="decimal"><button class="b" onclick="doImp()">Registrar imprevisto</button></div>'}

function vAtraso(){const o=[];
S.exp.filter(e=>!e.paused).forEach(e=>o.push('<option value="x:'+e.id+'">'+icon(e.n)+' '+esc(e.n)+'</option>'));
S.debts.filter(d=>d.bal>0).forEach(d=>o.push('<option value="'+d.id+'">💳 '+esc(d.n)+'</option>'));
o.push('<option value="otro">Otro</option>');
return '<h2>⏰ Pago atrasado</h2><div class="card"><p class="m">No pasa nada, aquí lo ordenamos. Dime cuál se atrasó y de cuánto, y quedará visible en Mi mes hasta que lo pagues.</p><label>¿Cuál pago?</label><select id="lp">'+o.join('')+'</select><label>Si elegiste Otro, escribe cuál</label><input id="lo"><label>¿Cuánto debes de ese pago?</label><input id="la" type="number" inputmode="decimal"><button class="b" onclick="addLate()">Registrar atraso</button></div>'}

function vHist(){const L=[...S.log].reverse();
if(!L.length)return '<h2>📜 Mi historial</h2><div class="card"><p class="m">Aún no hay movimientos. Cuando registres un cobro o un pago, aparecerá aquí.</p></div>';
const IC={ingreso:'💰',extra:'🎁',imprevisto:'⚠️',atraso:'⏰',pago:'✅'},NM={ingreso:'Cobro',extra:'Dinero extra',imprevisto:'Imprevisto',atraso:'Pago atrasado',pago:'Pago realizado'};
let h='<h2>📜 Mi historial</h2>',cur='';
L.forEach(e=>{const dt=new Date(e.t),mk2=dt.toLocaleDateString('es',{month:'long',year:'numeric'});
if(mk2!==cur){cur=mk2;h+='<div class="hd">'+mk2+'</div>'}
const op=openLog===e.t,ln=e.lines||[];
h+='<div class="card tap" onclick="toggleLog('+e.t+')"><div class="row" style="border:0;padding:0"><span>'+(IC[e.type]||'•')+' <b>'+(NM[e.type]||'')+'</b><div class="m">'+dt.toLocaleDateString('es',{day:'numeric',month:'short'})+(e.why?' · '+esc(e.why):'')+'</div></span><b>'+fm(e.amt)+'</b></div>'+(op&&ln.length?'<div style="margin-top:10px">'+ln.map(x=>'<div class="row"><span>'+esc(x.n)+'</span><b>'+fm(x.a)+'</b></div>').join('')+'</div>':'')+(!op&&ln.length?'<div class="m" style="margin-top:6px">Toca para ver el detalle</div>':'')+'</div>'});
return h}

function vSheet(){if(!sheet)return '';
const g=goal(),pc=g>0?Math.min(100,Math.round(S.fundBal/g*100)):0;
const tot=S.debts.reduce((s,d)=>s+Math.max(0,d.bal),0),all=S.paidTot+tot,dp=all>0?Math.round(S.paidTot/all*100):0;
let em='💡',ti='',tx='',mo='';
if(sheet=='fondo'){ti='🛟 Fondo de emergencia';
tx='El salvavidas es plata apartada solo para imprevistos: una reparación de la moto, una urgencia, un gasto que nadie esperaba. Cuando te sobra dinero, te sugiero apartar una parte aquí, hasta llegar a una meta equivalente a una semana de tus gastos esenciales. Así un susto no te devuelve al hoyo.';
if(g<=0){em='🤔';mo='Agrega tus gastos fijos para que yo calcule tu meta.'}
else if(pc==0){em='😢';mo='Todavía está vacío, pero cuando te sobre algo empieza a llenarse. Confío en que va a llegar.'}
else if(pc<50){em='🙂';mo='Ya empezó a llenarse. Vas por buen camino, sigue así.'}
else if(pc<100){em='😄';mo='Más de la mitad. ¡Ya casi tienes tu salvavidas completo!'}
else{em='🥳';mo='¡Meta cumplida! Estás {c} ante una sorpresa.'}}
else if(sheet=='diversion'){ti='🎈 Sobre de diversión';
tx='Es tu sobre para disfrutar sin culpa: una salida, un antojo, un gusto. Se llena con lo que sobra después de cubrir lo importante. Si pasa un imprevisto, se usa primero.';
if(S.funBal<=0){em='😕';mo='Está vacío por ahora. Cuando cubras lo importante, aquí llega tu premio.'}
else{em='😎';mo='Tienes para darte un gusto sin culpa. Te lo ganaste.'}}
else if(sheet=='deuda'){ti='🎯 Tu camino a la libertad';
tx='Este círculo muestra cuánto de tus deudas ya pagaste. Cada pago que marcas lo llena un poco más, hasta llegar al 100%.';
if(!S.debts.length){em='🌱';mo='Agrega tus deudas para empezar a ver tu avance.'}
else if(tot==0){em='🥳';mo='¡Libre de deudas! Lo lograste.'}
else if(dp==0){em='😟';mo='Aún no empieza a llenarse, pero ya diste el primer paso: mirar tus deudas de frente.'}
else if(dp<50){em='🙂';mo='Ya empezó a avanzar. Cada pago cuenta.'}
else{em='😄';mo='Más de la mitad. ¡Ya casi!'}}
else if(sheet=='disp'){ti='💵 Dinero disponible';
tx='Es el dinero que tienes ahora para pagar. Se suma cuando registras un cobro o un dinero extra, y baja cada vez que marcas un pago, apartas dinero o registras un gasto. Si ves un número negativo, gastaste más de lo que tenías: se compensa con tu próximo cobro.';
if(S.avail<-0.5){em='😟';mo='Estás en negativo. Con tu próximo cobro lo compensamos, con calma.'}
else if(S.avail<=0.5){em='😐';mo='Está en cero. Registra tu cobro para empezar.'}
else{em='🙂';mo='Tienes dinero para pagar lo que viene. Tú decides en qué.'}}
else if(sheet=='termo'){ti='🌡️ Capacidad de pago';
const p=S.sal>0?Math.round(need()/S.sal*100):0;
tx='Muestra cuánto de tu ingreso mensual se va en gastos fijos y cuotas mínimas, que son obligatorios. Lo que queda es tu margen: solo con ese margen puedes llenar el fondo, darte un gusto y acelerar tus deudas con la bola de nieve.';
if(!(S.sal>0)){em='🤔';mo='Dime cuánto esperas recibir al mes en Ajustes para calcularlo.'}
else if(p<75){em='😄';mo='Tienes buen margen. Úsalo para acelerar tus deudas.'}
else if(p<=92){em='😐';mo='El margen es justo. Cada peso que recortes o ganes de más cuenta.'}
else{em='😟';mo='El margen es muy chico. Mira las ideas: pausar gastos, renegociar o aumentar tu ingreso. Un paso a la vez.'}}
else if(sheet=='gastos'){em='🧾';ti='🧾 Gastos fijos';
tx='Aquí van todos los gastos que se repiten cada mes. Los esenciales (alquiler, luz) no se tocan. Los que se pueden pausar (suscripciones, gimnasio) los frenas uno o dos meses si falta dinero. Si le pones día de pago, aparece en Mi mes con su fecha, para pagarlo completo. Si no tiene día (como la comida), lo vas registrando poco a poco.';
mo='Entre más completa esté tu lista y más días de pago tengas, más útil será Mi mes.'}
else{em='⏸️';ti='⏸️ Gastos pausables';
tx='Son suscripciones y gastos fijos que no son esenciales. Si el dinero no alcanza, se pausan uno o dos meses para cubrir lo importante, y la app te avisa cuándo retomarlos.';
mo='Pausar no es perder: es cuidar lo importante primero.'}
return '<div class="ov" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="mood">'+em+'</div><h2 style="margin:10px 0">'+ti+'</h2><p class="m" style="text-align:left">'+tx+'</p><div class="card hi" style="margin:12px 0;text-align:left">'+fmtMsg(mo)+'</div><button class="b" onclick="closeSheet()">Entendido</button></div></div>'}

function vForm(first){const o=(v,t,c)=>'<option value="'+v+'"'+(c==v?' selected':'')+'>'+t+'</option>';
return (first?'<h2>👋 ¡Bienvenido!</h2><p class="m">Vamos a configurar tu app. Son solo unos datos. Todo se guarda únicamente en tu teléfono y nadie más lo ve. Después te pediré tus gastos fijos y tus deudas.</p>':'<h2>⚙️ Ajustes</h2>')+'<div class="card"><label>Tu nombre</label><input id="fn" value="'+esc(S.name)+'"><label>Eres</label><select id="fg">'+o('f','Mujer',S.g)+o('m','Hombre',S.g)+'</select><label>Símbolo de tu moneda (ej. $ o €)</label><input id="fc" value="'+esc(S.cur)+'"><label>¿A qué te dedicas?</label><select id="fj">'+o('delivery','Delivery / reparto',S.job)+o('empleado','Empleado',S.job)+o('independiente','Independiente',S.job)+o('otro','Otro',S.job)+'</select><label>Tu ingreso es</label><select id="fi">'+o('variable','Variable (cambia cada vez)',S.inc)+o('fijo','Fijo (sueldo)',S.inc)+'</select><label>¿Cuánto esperas recibir al mes? (opcional)</label><input id="fs" type="number" inputmode="decimal" value="'+(S.sal||'')+'"><label>¿Cada cuánto cobras?</label><select id="ff">'+o('semanal','Cada semana',S.freq)+o('quincenal','Cada quincena',S.freq)+o('mensual','Cada mes',S.freq)+'</select><label>Días del mes en que cobras (ej. 5, 19)</label><input id="fp" value="'+S.payDays.join(', ')+'">'+(first?'':'<label>Método para el dinero extra</label><select id="fm">'+o('bola','Bola de nieve (la deuda más pequeña primero)',S.method)+o('av','Avalancha (la de más interés primero)',S.method)+'</select><label>% del sobrante para diversión (máx. 30)</label><input id="fu" type="number" value="'+S.fun+'"><label>Modo avanzado (horas trabajadas y gasto de trabajo)</label><select id="fd">'+o('0','Apagado',S.adv?'1':'0')+o('1','Encendido',S.adv?'1':'0')+'</select>')+'</div><button class="b" onclick="saveForm('+first+')">'+(first?'Empezar':'Guardar')+'</button>'+(first?'':'<button class="b g" onclick="resetAll()">Borrar todos mis datos</button>')}

function confetti(){const c=['#6c4cf1','#4c8df6','#17a673','#f5a524','#e0559e'];
for(let i=0;i<46;i++){const e=document.createElement('span');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDuration=(1.8+Math.random()*1.6)+'s';e.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4300)}}
function countUp(){if(RM)return;document.querySelectorAll('[data-v]').forEach(el=>{const v=+el.dataset.v;let s=null;
const st=ts=>{if(!s)s=ts;const p=Math.min(1,(ts-s)/800);el.textContent=fr(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}

function render(keep){const nav=document.getElementById('nav');
if(!S.setup){document.getElementById('app').innerHTML=vForm(true);nav.innerHTML='';return}
roll();
document.getElementById('app').innerHTML={inicio:vInicio,mes:vMes,cobro:vCobro,deudas:vDeudas,imp:vImp,atraso:vAtraso,hist:vHist,ajustes:()=>vForm(false)}[tab]()+vSheet();
nav.innerHTML=[['inicio','🏠','Inicio'],['mes','📅','Mi mes'],['cobro','💰','Cobro'],['deudas','📋','Deudas'],['ajustes','⚙️','Ajustes']].map(t=>'<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span><span>'+t[2]+'</span></button>').join('');
if(!keep)window.scrollTo(0,0);
countUp();
if(boom){boom=false;if(!RM)confetti()}}
render();
</script></body></html>
