<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">

<style>
:root{--bg:#f3f4fb;--c:#fff;--t:#1d2433;--m:#6b7385;--p:#6c4cf1;--ok:#17a673;--w:#e5484d;--b:#e6e8f2;--sh:0 6px 20px rgba(60,50,140,.09)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);padding:14px 14px 100px;max-width:520px}
h2{margin:8px 0 14px;font-size:25px}
p{line-height:1.5}
.card{background:var(--c);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);animation:up .5s both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.hero{background:linear-gradient(135deg,#5b3df5,#8e44ec 55%,#e0559e);color:#fff;text-align:center;padding:20px 16px}
.hero p{margin:6px 0 0}
.hi{background:linear-gradient(135deg,#6c4cf1,#4c8df6);color:#fff;font-size:17px;line-height:1.45}
.warm{background:linear-gradient(135deg,#fff4e0,#ffe6ea);color:#3a2a1a}
.warm .m{color:#7a6552}
.m{color:var(--m);font-size:14px}.m2{opacity:.85;font-size:14px}
.big{font-size:40px;font-weight:800;margin:2px 0 6px}
.mid{font-size:22px;font-weight:700;margin:4px 0}
.pill{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:6px 12px;font-size:13px;margin-top:8px}
.rg{width:130px;height:130px;display:block;margin:6px auto}
.ring{stroke-dashoffset:var(--off);animation:ring 1.3s ease-out both}
@keyframes ring{from{stroke-dashoffset:327}}
input,select{width:100%;padding:12px;margin:4px 0 12px;border:2px solid var(--b);border-radius:12px;background:var(--bg);color:var(--t);font-size:16px}
input:focus,select:focus{outline:0;border-color:var(--p)}
label{font-size:14px;color:var(--m)}
.b{display:block;width:100%;padding:14px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(135deg,#6c4cf1,#4c8df6);color:#fff;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(108,76,241,.35);transition:transform .15s}
.b:active{transform:scale(.97)}
.g{background:var(--c);color:var(--t);border:2px solid var(--b);box-shadow:none}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.gr2 .b{margin-top:0}
.st{background:var(--c);border-radius:18px;padding:14px;box-shadow:var(--sh);animation:up .5s both}
.tap{cursor:pointer}
.x{background:none;border:0;color:var(--w);font-size:14px;padding:0}
.mini{padding:8px 12px;font-size:13px;border-radius:10px;border:2px solid var(--b);background:var(--c);color:var(--t);font-weight:600}
.mini.p{background:var(--p);color:#fff;border-color:var(--p)}
.ar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hd{font-size:13px;font-weight:700;color:var(--m);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}
.row:last-child{border:0}.ok{color:var(--ok);font-weight:700}.w{color:var(--w);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:linear-gradient(90deg,#17a673,#4ade80);border-radius:6px;animation:grow 1s both;transform-origin:left}
.seg{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:12px 0}
.seg i{display:block;height:100%;animation:grow .9s both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sh{background:var(--c);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 26px;text-align:center;animation:slide .3s both}
@keyframes slide{from{transform:translateY(60px);opacity:0}}
.mood{font-size:66px;animation:pop .6s both}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);box-shadow:0 -4px 18px rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;padding:9px 2px 10px;border:0;background:none;color:var(--m);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav .ic{font-size:21px;transition:transform .2s}
nav button.on{color:var(--p);font-weight:700}
nav button.on .ic{transform:translateY(-3px) scale(1.2)}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:99;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><nav id="nav"></nav>
<script>
const K='libreDeudas3';
const def={setup:false,name:'',g:'f',cur:'$',job:'delivery',inc:'variable',sal:0,adv:false,freq:'mensual',method:'bola',fun:10,pct:5,fundBal:0,funBal:0,pend:0,gap:[],paidTot:0,rentDay:0,sav:{},late:[],paus:[],log:[],fix:{trabajo:0,basicos:0,alquiler:0},debts:[],hist:[],used:{}};
let S;try{S=Object.assign(JSON.parse(JSON.stringify(def)),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=JSON.parse(JSON.stringify(def))}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const FAC={semanal:.25,quincenal:.5,mensual:1};
const JOB={delivery:'Moto (gasolina y mantenimiento)',empleado:'Transporte al trabajo',independiente:'Herramientas y materiales',otro:'Gastos del trabajo'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>esc(S.cur)+Math.round(n).toLocaleString('es');
const fr=n=>S.cur+Math.round(n).toLocaleString('es');

const F={
abrir:[
"Hola, {n}. Hoy es un buen día para dar un paso, por pequeño que sea. 💛",
"No tienes que arreglarlo todo hoy. Solo seguir avanzando.",
"Cada día que abres esta app es un día que eliges tu libertad, {n}.",
"Estás más cerca de lo que crees. Sigue.",
"Tu esfuerzo de cada día vale mucho. Vamos a cuidarlo.",
"Quien se atreve a mirar sus deudas de frente ya ganó la mitad de la batalla.",
"Un paso a la vez. Hoy toca uno más.",
"Eres más fuerte que tus deudas, {n}. Y vas a demostrarlo.",
"Qué bueno verte por aquí. Tu tranquilidad se construye con días como hoy.",
"No estás {s} en esto. Aquí estoy para ayudarte a ordenar todo.",
"Pequeñas decisiones, grandes cambios. Hoy tú decides.",
"Respira. Tienes un plan, y el plan funciona si lo sigues."],
ingreso:[
"¡Entró dinero, {n}! Vamos a darle un destino a cada peso. 💪",
"Eso es trabajo duro convertido en libertad. Repartámoslo bien.",
"Cada peso que entra es una herramienta. Usémosla con inteligencia.",
"Qué orgullo ver tu esfuerzo. Ahora a repartirlo con cabeza.",
"Buen trabajo. Ahora lo importante: que cada peso haga su parte.",
"Lo ganaste tú. Ahora que trabaje para ti.",
"Ingreso registrado. Vamos a ver cómo rinde.",
"Tu esfuerzo merece un buen plan. Aquí lo tienes."],
extra:[
"🎁 ¡Qué buena noticia, {n}! Un dinero extra es un empujón para tu libertad.",
"Esto es un regalo del esfuerzo. Vamos a usarlo con cabeza.",
"Dinero extra recibido. Cada peso de más acorta el camino.",
"Qué bien, {n}. Lo inesperado también puede ayudarte a avanzar.",
"Un empujón extra. Hagamos que rinda al máximo.",
"No se gasta, se invierte en tu tranquilidad. Veamos cómo repartirlo."],
pago:[
"¡Lo lograste, {n}! Cada pago te acerca a tu libertad. 🎉",
"Pago hecho. Hoy le ganaste un pedazo a tus deudas.",
"Eso es disciplina. Qué orgullo tu constancia.",
"Un pago más. Así se construye la libertad, paso a paso.",
"Cumpliste con tu responsabilidad y eso dice mucho de ti.",
"Mira lo que hiciste hoy: tu deuda es más pequeña que ayer.",
"Cada pago es un voto de confianza en tu futuro. Bien hecho.",
"Sigue así, {n}. La constancia es tu mejor arma.",
"Lo que parecía imposible se está volviendo realidad.",
"Te mereces sentirte {o} de este avance."],
atraso:[
"Un mes difícil le pasa a cualquiera, {n}. Lo importante es que seguimos. 💛",
"Atrasarse no te define. Retomar sí. Ya quedó anotado y lo cubrimos primero.",
"No pasa nada. Hoy es un buen día para volver a empezar.",
"Esto es un tropiezo, no el final. Levántate, que tú puedes.",
"No te castigues. Respira, ordena y da el siguiente paso.",
"Todos tenemos semanas flojas. Lo que cuenta es volver.",
"Aunque hoy no se pudo, mañana es otra oportunidad. Aquí sigo contigo.",
"Lo importante es que no te rindes. Retomemos con calma.",
"Un atraso se arregla. Lo que no se arregla es rendirse, y tú no te rindes.",
"Sigue. Un pequeño pago hoy vale más que un gran pago nunca."],
hito:[
"🏆 ¡UNA DEUDA MENOS, {n}! Esto merece celebrarse.",
"🎉 Deuda saldada. Mira todo lo que has avanzado.",
"¡Libre de esa deuda! Una carga menos sobre tus hombros.",
"Eso que parecía imposible ya está hecho. Orgullo total. 🙌",
"¡Cerraste una deuda! Ahora ese dinero se libera para la siguiente.",
"Lo hiciste. Respira hondo y disfrútalo, te lo ganaste.",
"Una victoria más. Cada deuda saldada te acerca a la libertad total.",
"¡Increíble constancia! Una deuda menos y muchas ganas de más."],
imprevisto:[
"Los imprevistos pasan, {n}. Para eso estamos preparados. 💪",
"Esto no te tumba. Lo cubrimos y seguimos.",
"Un imprevisto no borra tu progreso. Ajustamos y continuamos.",
"Respira. Para momentos como este existe tu fondo.",
"Lo importante es que lo registraste y no lo escondiste. Eso es madurez.",
"Nadie se libra de las sorpresas. Tú ya tienes un plan para ellas.",
"Esto es un bache, no el final del camino.",
"Con calma, {n}. Lo vamos resolviendo paso a paso."],
nueva:[
"Gracias por registrarla, {n}. Ver todo claro es lo que nos permite ganarle.",
"Una deuda nueva se ordena igual que las demás. Ya quedó en el plan.",
"Mejor tenerla a la vista que escondida. Buen paso.",
"Tu plan se ajustó. Seguimos avanzando.",
"Registrarla toma valentía. Eso es lo que cambia las cosas.",
"Todo queda ordenado otra vez. Tú sigue."],
fondo:[
"🎉 ¡Llegaste a la meta de tu fondo de emergencia, {n}! Ahora tienes un colchón para los imprevistos.",
"Meta del fondo cumplida. Desde ahora ese porcentaje va directo a tus deudas. 🙌",
"Mira lo que lograste: ya estás {c} ante una sorpresa. Sigue con tus deudas.",
"¡Fondo completo! Dormir más tranquilo también es progreso.",
"Lo lograste. Ahora todo el esfuerzo extra va a ganarle a las deudas."],
pausa:[
"Pausar no es rendirse, {n}: es cuidar lo importante primero. 💛",
"Buena decisión. Esa plata ahora trabaja para tu libertad.",
"Es solo por un tiempo. Cuando estés mejor, lo retomamos.",
"Cuidar lo esencial primero es de personas sabias."]};

function fmtMsg(t){return t.replace(/\{n\}/g,esc(S.name||'amigo')).replace(/\{o\}/g,S.g=='m'?'orgulloso':'orgullosa').replace(/\{s\}/g,S.g=='m'?'solo':'sola').replace(/\{c\}/g,S.g=='m'?'cubierto':'cubierta')}
function pick(c){const a=F[c];let u=S.used[c]||[];let o=a.map((_,i)=>i).filter(i=>!u.includes(i));
if(!o.length){u=[];o=a.map((_,i)=>i)}
const i=o[Math.floor(Math.random()*o.length)];u.push(i);S.used[c]=u;save();return fmtMsg(a[i])}let tab='inicio',msg=null,res=null,imp=null,dm=null,boom=false,sheet=null,openLog=null;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL=['#6c4cf1','#4c8df6','#17a673','#f5a524','#e0559e','#14b8c4','#ef6c4d','#8e44ec'];
const ka=k=>typeof k=='string'?"'"+k+"'":k;
const goal=()=>(S.fix.basicos+S.fix.trabajo)/4;
const pausAct=()=>S.paus.filter(p=>!p.paused);
const pausSum=()=>pausAct().reduce((s,p)=>s+p.amt,0);
const need=()=>S.fix.trabajo+S.fix.basicos+S.fix.alquiler+pausSum()+S.debts.filter(d=>d.bal>0).reduce((s,d)=>s+d.min,0);
function addLog(o){S.log.push(o);if(S.log.length>300)S.log.shift()}
function applyDebt(d,amt){const a=Math.min(amt,d.bal);d.bal-=a;S.paidTot+=a;if(d.bal<=0.5){d.bal=0;return true}return false}
function daysLeft(day){if(!day)return null;const t=new Date(),td=t.getDate(),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return day>=td?day-td:dim-td+day}
function netHour(){const a=S.hist.filter(x=>x.h>0).slice(-4);if(a.length<3)return null;const h=a.reduce((s,x)=>s+x.h,0),n=a.reduce((s,x)=>s+x.inc-(x.g||0),0);return n/h}

function tips(hole){const nh=S.adv?netHour():null;let ganar;
if(S.job=='delivery')ganar='Trabajar en horas pico (almuerzo y cena), fines de semana o con más de una plataforma. Ojo: más horas solo sirven si cada hora te deja ganancia después de la gasolina.';
else if(S.job=='independiente')ganar='Ofrecer tu servicio a más clientes y revisar si estás cobrando lo que vale tu tiempo.';
else ganar='Horas extra si tu trabajo las permite, un trabajo extra de fin de semana o vender algo que ya no uses.';
if(S.adv){ganar+=nh===null?' Aún no tengo datos suficientes para decirte si las horas extra te convienen: sigue registrando horas y gasto de trabajo.':(nh>0?' Tus últimas horas te dejaron en promedio '+fm(nh)+' netos por hora.':' Tus últimas horas casi no te dejaron ganancia neta, así que conviene recortar antes que trabajar más.')}
const pa=pausAct();
const pz=pa.length?'<p><b>⏸️ Pausar por ahora:</b> '+pa.map(p=>esc(p.n)+' ('+fm(p.amt)+')').join(', ')+'. Pausarlos liberaría '+fm(pausSum())+' al mes.</p><div class="ar">'+pa.map(p=>'<button class="mini p" onclick="pauseIt('+p.id+',1)">Pausar '+esc(p.n)+' 1 mes</button>').join('')+'</div><p class="m">Si prefieres 2 meses, cámbialo en la pestaña Deudas.</p>':'';
return '<div class="card warm"><b>💡 Te faltan '+fm(hole)+'. Algunas ideas</b><br><br>'+pz+'<p><b>1. Recortar:</b> revisa salidas, comida fuera de casa y compras por impulso. Bajar lo no esencial es lo más rápido.</p><p><b>2. Renegociar:</b> pídele a quien más interés te cobra una pausa, un plazo más largo o una cuota menor.</p><p><b>3. Ganar más:</b> '+ganar+'</p><p class="m">No hace falta hacerlo todo. Elige una y empieza.</p></div>'}

function plan(inc,ex0){const f=FAC[S.freq];let r=inc;const L=[],paid={};
const add=(n,nd,o)=>{o=o||{};nd=Math.max(0,nd);const a=Math.min(nd,r);r-=a;L.push(Object.assign({n,need:nd,a},o));
if(o.d)paid[o.d.id]=(paid[o.d.id]||0)+a;
if(o.sv&&o.key!==undefined&&o.key!=='rent')paid[o.key]=(paid[o.key]||0)+a};
if(ex0)S.gap.forEach((g,i)=>add('🧩 Completar: '+g.n,g.amt,{gk:i,key:g.key,sv:g.key!==undefined&&g.key!==null}));
if(S.pend>0)add('⚠️ Imprevisto por compensar',S.pend,{pend:true});
S.late.forEach((l,i)=>{const d=l.debtId?S.debts.find(q=>q.id==l.debtId&&q.bal>0):null;add('⏰ Atrasado: '+l.n,l.amt,{lk:i,d:d||undefined})});
const ds=S.debts.filter(d=>d.bal>0);
if(!ex0){
add('🛵 '+JOB[S.job],S.fix.trabajo*f);
add('🍽️ Comida y servicios básicos',S.fix.basicos*f);
if(pausSum()>0)add('⏸️ Suscripciones y gastos pausables',pausSum()*f);
add('🏠 Alquiler (apartado)',S.fix.alquiler*f,{sv:true,key:'rent'});
ds.filter(d=>d.es).forEach(d=>add('💳 '+d.n+' (esencial)',Math.min(d.min*f,d.bal),{sv:true,key:d.id}));
ds.filter(d=>!d.es).forEach(d=>add('💳 '+d.n+' (mínimo)',Math.min(d.min*f,d.bal),{sv:true,key:d.id}))}
const short=L.reduce((s,x)=>s+x.need-x.a,0);
const g=goal();let fund=Math.round(inc*S.pct/100);
if(g>0)fund=Math.min(fund,Math.max(0,g-S.fundBal));
fund=Math.max(0,Math.min(fund,r));r-=fund;
if(fund>0)L.push({n:'🛟 Fondo de emergencia',need:fund,a:fund});
let fun=0,ex=0;
if(r>0){fun=Math.round(r*S.fun/100);ex=r-fun}
const ord=[...ds].sort((a,b)=>S.method=='bola'?a.bal-b.bal:b.rate-a.rate);
for(const d of ord){if(ex<=0)break;const p=Math.min(ex,d.bal-(paid[d.id]||0)-(S.sav[d.id]||0));
if(p>0){L.push({n:'🎯 Extra para '+d.n,need:p,a:p,d});paid[d.id]=(paid[d.id]||0)+p;ex-=p}}
fun+=ex;return{inc,L,fun,short:ex0?0:short,fund,extra:!!ex0}}

function go(t){tab=t;imp=null;dm=null;res=null;openLog=null;sheet=null;if(t=='inicio')msg=null;render()}
function calc(){const v=+document.getElementById('inc').value;if(!(v>0)){alert('Escribe cuánto ingresó.');return}
res=plan(v,false);res.hint=pick('ingreso');
if(S.adv){res.h=+document.getElementById('ih').value||0;res.g=+document.getElementById('ig').value||0}
render()}
function calcExtra(){const v=+document.getElementById('ev').value;if(!(v>0)){alert('Escribe cuánto dinero extra te llegó.');return}
res=plan(v,true);res.hint=pick('extra');res.why=document.getElementById('em').value.trim();
res.before=S.debts.reduce((s,d)=>s+d.bal,0);
res.after=res.before-res.L.reduce((s,x)=>s+(x.d&&!x.sv?x.a:0),0);render()}
function confirmPay(){let cleared=false,dp=0;const items=[];
res.L.forEach(x=>{if(!(x.a>0))return;
if(x.sv&&x.key!==undefined){S.sav[x.key]=(S.sav[x.key]||0)+x.a;if(x.key!=='rent')dp+=x.a}
else if(x.d){const d=S.debts.find(q=>q.id==x.d.id);if(d&&applyDebt(d,x.a))cleared=true;dp+=x.a}
if(x.pend)S.pend=Math.max(0,S.pend-x.a);
if(x.lk!==undefined)S.late[x.lk].amt-=x.a;
if(x.gk!==undefined)S.gap[x.gk].amt-=x.a;
items.push({n:x.n,a:x.a})});
S.late=S.late.filter(l=>l.amt>0.5);
if(res.extra)S.gap=S.gap.filter(g=>g.amt>0.5);
else S.gap=res.L.filter(x=>!x.pend&&x.lk===undefined&&x.gk===undefined&&x.need>x.a+0.5).map(x=>({n:x.n.replace(/^\S+\s/,''),amt:x.need-x.a,key:x.key}));
if(res.fun>0)items.push({n:'🎈 Sobre de diversión',a:res.fun});
const g=goal(),was=g>0&&S.fundBal>=g;
S.fundBal+=res.fund;S.funBal+=res.fun;
const hit=!was&&g>0&&S.fundBal>=g;
S.hist.push({t:Date.now(),inc:res.inc,mp:res.extra?0:dp/FAC[S.freq],h:res.h||0,g:res.g||0,ex:!!res.extra});
addLog({t:Date.now(),type:res.extra?'extra':'ingreso',amt:res.inc,why:res.why||'',lines:items});
save();msg=pick(cleared?'hito':hit?'fondo':'pago');boom=true;res=null;tab='inicio';render()}
function payApt(key){const amt=S.sav[key]||0;if(!(amt>0))return;let cleared=false,n='Alquiler';
if(key!=='rent'){const d=S.debts.find(q=>q.id==key);if(d){n=d.n;cleared=applyDebt(d,amt)}}
S.sav[key]=0;addLog({t:Date.now(),type:'pago',amt,why:'',lines:[{n:'✅ Pagado: '+n,a:amt}]});
save();msg=pick(cleared?'hito':'pago');boom=true;tab='inicio';render()}
function payLate(i){const l=S.late[i];if(!l)return;let cleared=false;
if(l.debtId){const d=S.debts.find(q=>q.id==l.debtId);if(d)cleared=applyDebt(d,l.amt)}
addLog({t:Date.now(),type:'pago',amt:l.amt,why:'',lines:[{n:'✅ Pagado: '+l.n,a:l.amt}]});
S.late.splice(i,1);save();msg=pick(cleared?'hito':'pago');boom=true;render()}
function addLate(){const v=document.getElementById('lp').value,a=+document.getElementById('la').value;
if(!(a>0)){alert('Escribe cuánto es.');return}
let n,id=null;
if(v=='rent')n='Alquiler';
else if(v=='otro')n=document.getElementById('lo').value.trim()||'Otro pago';
else{const d=S.debts.find(q=>q.id==v);n=d?d.n:'Pago';id=d?d.id:null}
S.late.push({n,amt:a,debtId:id});addLog({t:Date.now(),type:'atraso',amt:a,why:n,lines:[]});
save();msg=pick('atraso');tab='inicio';render()}
function pauseIt(id,m){const p=S.paus.find(q=>q.id==id);if(!p)return;p.paused=true;p.until=Date.now()+m*30*864e5;save();msg=pick('pausa');res=null;tab='inicio';render()}
function resumeIt(id){const p=S.paus.find(q=>q.id==id);if(!p)return;p.paused=false;p.until=null;save();render(true)}
function addPaus(){const n=document.getElementById('pn').value.trim(),a=+document.getElementById('pa').value;
if(!n||!(a>0)){alert('Escribe el nombre y cuánto cuesta al mes.');return}
S.paus.push({id:Date.now(),n,amt:a,paused:false,until:null});save();render(true)}
function delPaus(id){if(confirm('¿Borrar este gasto?')){S.paus=S.paus.filter(p=>p.id!=id);save();render(true)}}
function doImp(){const v=+document.getElementById('iv').value;if(!(v>0)){alert('Escribe cuánto fue el gasto.');return}
let r=v;const a=Math.min(r,S.funBal);S.funBal-=a;r-=a;const b=Math.min(r,S.fundBal);S.fundBal-=b;r-=b;
const ln=[];if(a>0)ln.push({n:'🎈 Del sobre de diversión',a});if(b>0)ln.push({n:'🛟 Del fondo de emergencia',a:b});if(r>0)ln.push({n:'⚠️ Por compensar en el próximo ingreso',a:r});
if(r>0)S.pend+=r;addLog({t:Date.now(),type:'imprevisto',amt:v,why:'',lines:ln});
save();imp={v,a,b,r};msg=pick('imprevisto');tab='inicio';render()}
function addDebt(){const n=document.getElementById('dn').value.trim(),bal=+document.getElementById('db').value;
if(!n||!(bal>0)){alert('Escribe el nombre y cuánto debes.');return}
S.debts.push({id:Date.now(),n,bal,ini:bal,min:+document.getElementById('dm').value||0,rate:+document.getElementById('dr').value||0,day:Math.min(31,Math.max(0,+document.getElementById('dd').value||0)),es:document.getElementById('de').checked});
save();dm=pick('nueva');render()}
function delDebt(id){if(confirm('¿Borrar esta deuda?')){S.debts=S.debts.filter(d=>d.id!=id);delete S.sav[id];save();render()}}
function saveForm(first){const v=id=>document.getElementById(id).value;
const n=v('fn').trim();if(!n){alert('Escribe tu nombre.');return}
S.name=n;S.g=v('fg');S.cur=v('fc').trim()||'$';S.job=v('fj');S.freq=v('ff');S.inc=v('fi');S.sal=Math.max(0,+v('fs')||0);
if(!first){S.method=v('fm');S.fun=Math.min(30,Math.max(0,+v('fu')||0));S.adv=v('fd')=='1'}
S.fix={trabajo:Math.max(0,+v('fk')||0),basicos:Math.max(0,+v('fb')||0),alquiler:Math.max(0,+v('fa')||0)};
S.rentDay=Math.min(31,Math.max(0,+v('fr')||0));
S.setup=true;save();msg=null;tab=first?'deudas':'inicio';render()}
function resetAll(){if(confirm('Se borrarán TODOS tus datos de este teléfono. ¿Seguro?')){try{localStorage.removeItem(K)}catch(e){}S=JSON.parse(JSON.stringify(def));tab='inicio';msg=null;res=null;render()}}

function dist(r,title){const rows=r.L.filter(x=>x.need>0).map(x=>({n:x.n,a:x.a,nd:x.need}));
if(r.fun>0)rows.push({n:'🎈 Sobre de diversión',a:r.fun,nd:r.fun});
return '<div class="card"><b>'+title+'</b><div class="seg">'+rows.map((x,i)=>x.a>0?'<i style="flex:'+x.a+';background:'+COL[i%COL.length]+'"></i>':'').join('')+'</div>'+rows.map((x,i)=>'<div class="row"><span><i class="dot" style="background:'+COL[i%COL.length]+'"></i>'+esc(x.n)+'</span><span class="'+(x.a<x.nd?'w':'ok')+'">'+fm(x.a)+'</span></div>').join('')+'</div>'}

function aptCard(){const it=[];
if(S.fix.alquiler>0)it.push({key:'rent',n:'🏠 Alquiler',t:S.fix.alquiler,day:S.rentDay});
S.debts.filter(d=>d.bal>0&&d.min>0).forEach(d=>it.push({key:d.id,n:'💳 '+d.n,t:d.min,day:d.day}));

else if(tot==0)hero='<div class="card hero tap" onclick="info(\'deuda\')"><div style="font-size:50px">🎉</div><b style="font-size:20px">¡Libre de deudas!</b><p>Lo lograste, '+esc(S.name)+'. Esto es tuyo.</p></div>';
else hero='<div class="card hero tap" onclick="info(\'deuda\')"><div class="m2">Tu deuda total</div><div class="big" data-v="'+tot+'">'+fm(tot)+'</div><svg class="rg" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="12"/><circle class="ring" cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="327" style="--off:'+off+'" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">'+pct+'%</text></svg><div class="m2">de tu deuda ya pagada</div>'+est+'<div class="m2" style="font-size:12px;margin-top:8px">Toca para saber más</div></div>';
let im='';if(imp)im='<div class="card"><b>⚠️ Imprevisto de '+fm(imp.v)+'</b><div class="m">'+(imp.a>0?'Del sobre de diversión: '+fm(imp.a)+'. ':'')+(imp.b>0?'Del fondo de emergencia: '+fm(imp.b)+'. ':'')+(imp.r>0?'Faltaron '+fm(imp.r)+', que se compensan en tu próximo ingreso.':'Quedó todo cubierto.')+'</div></div>';
const due=S.paus.filter(p=>p.paused&&p.until&&p.until<=Date.now());
const dp2=due.length?'<div class="card warm"><b>⏯️ Ya pasó el tiempo de pausa</b><div class="m">¿Retomamos estos gastos?</div>'+due.map(p=>'<div class="row"><span>'+esc(p.n)+' · '+fm(p.amt)+'</span><button class="mini p" onclick="resumeIt('+p.id+')">Retomar</button></div>').join('')+'</div>':'';
const lt=S.late.length?'<div class="card warm"><b>⏰ Pagos atrasados</b><div class="m">Los cubro primero con tu próximo ingreso o dinero extra.</div>'+S.late.map((l,i)=>'<div class="row"><span>'+esc(l.n)+' · <b>'+fm(l.amt)+'</b></span><button class="mini p" onclick="payLate('+i+')">Ya lo pagué</button></div>').join('')+'</div>':'';
let dg='';if(S.inc=='fijo'&&S.sal>0&&need()>S.sal)dg=tips(need()-S.sal);
const tiles='<div class="gr2"><div class="st tap" onclick="info(\'fondo\')"><div class="m">🛟 Fondo de emergencia</div><div class="mid">'+fm(S.fundBal)+'</div>'+(g>0?'<div class="bar"><div style="width:'+pc+'%"></div></div><div class="m">Meta: '+fm(g)+'</div>':'<div class="m">Configura tus gastos en Ajustes</div>')+'</div><div class="st tap" onclick="info(\'diversion\')"><div class="m">🎈 Sobre de diversión</div><div class="mid">'+fm(S.funBal)+'</div><div class="m">Toca para saber más</div></div></div>'+(S.pend>0?'<div class="card warm"><b>⚠️ Imprevisto por compensar: '+fm(S.pend)+'</b><div class="m">Se cubre en tu próximo ingreso o dinero extra.</div></div>':'');
return '<div class="card hi">'+msg+'</div>'+hero+im+dp2+lt+dg+tiles+aptCard()+'<button class="b" onclick="go(\'ingreso\')">💰 Registrar ingreso</button><div class="gr2" style="margin-top:12px"><button class="b g" onclick="go(\'extra\')">🎁 Dinero extra</button><button class="b g" onclick="go(\'imp\')">⚠️ Imprevisto</button></div><div class="gr2"><button class="b g" onclick="go(\'atraso\')">⏰ Pago atrasado</button><button class="b g" onclick="go(\'hist\')">📜 Mi historial</button></div>'}

return '<div class="row" style="align-items:flex-start"><div style="flex:1"><b>'+esc(d.n)+'</b>'+(d.es?' ⭐':'')+(d.bal==0?' ✅ Saldada':'')+'<div class="m">Debe '+fm(d.bal)+' · cuota '+fm(d.min)+' · interés '+d.rate+'%'+(d.day?' · día '+d.day:'')+'</div><div class="bar"><div style="width:'+Math.max(0,pc)+'%"></div></div></div><button class="x" onclick="delDebt('+d.id+')">Borrar</button></div>'}).join('');

function vHist(){const L=[...S.log].reverse();
if(!L.length)return '<h2>📜 Mi historial</h2><div class="card"><p class="m">Aún no hay movimientos. Cuando repartas un ingreso, aparecerá aquí.</p></div>';
const IC={ingreso:'💰',extra:'🎁',imprevisto:'⚠️',atraso:'⏰',pago:'✅'},NM={ingreso:'Ingreso',extra:'Dinero extra',imprevisto:'Imprevisto',atraso:'Pago atrasado',pago:'Pago realizado'};
let h='<h2>📜 Mi historial</h2>',cur='';
L.forEach(e=>{const dt=new Date(e.t),mk=dt.toLocaleDateString('es',{month:'long',year:'numeric'});

h+='<div class="card tap" onclick="toggleLog('+e.t+')"><div class="row" style="border:0;padding:0"><span>'+(IC[e.type]||'•')+' <b>'+(NM[e.type]||'')+'</b><div class="m">'+dt.toLocaleDateString('es',{day:'numeric',month:'short'})+(e.why?' · '+esc(e.why):'')+'</div></span><b>'+fm(e.amt)+'</b></div>'+(op&&ln.length?'<div style="margin-top:10px">'+ln.map(x=>'<div class="row"><span>'+esc(x.n)+'</span><b>'+fm(x.a)+'</b></div>').join('')+'</div>':'')+(!op&&ln.length?'<div class="m" style="margin-top:6px">Toca para ver el detalle</div>':'')+'</div>'});
return h}

function vSheet(){if(!sheet)return '';
const g=goal(),pc=g>0?Math.min(100,Math.round(S.fundBal/g*100)):0;
const tot=S.debts.reduce((s,d)=>s+Math.max(0,d.bal),0),all=S.paidTot+tot,dp=all>0?Math.round(S.paidTot/all*100):0;
let em='💡',ti='',tx='',mo='';
if(sheet=='fondo'){ti='🛟 Fondo de emergencia';
tx='El salvavidas es plata apartada solo para imprevistos: una reparación de la moto, una urgencia, un gasto que nadie esperaba. Sale del '+S.pct+'% de cada ingreso, hasta llegar a una meta equivalente a una semana de tus gastos básicos. Así un susto no te devuelve al hoyo.';
if(g<=0){em='🤔';mo='Configura tus gastos en Ajustes para que yo calcule tu meta.'}
else if(pc==0){em='😢';mo='Todavía está vacío, pero con tu próximo ingreso empieza a llenarse. Confío en que va a llegar.'}

else if(pc<100){em='😄';mo='Más de la mitad. ¡Ya casi tienes tu salvavidas completo!'}
else{em='🥳';mo='¡Meta cumplida! Estás {c} ante una sorpresa.'}}
else if(sheet=='diversion'){ti='🎈 Sobre de diversión';
tx='Es tu sobre para disfrutar sin culpa: una salida, un antojo, un gusto. Se llena con lo que sobra después de cubrir lo importante. Si pasa un imprevisto, se usa primero.';
if(S.funBal<=0){em='😕';mo='Está vacío por ahora. Cuando cubras lo importante, aquí llega tu premio.'}
else{em='😎';mo='Tienes para darte un gusto sin culpa. Te lo ganaste.'}}
else if(sheet=='deuda'){ti='🎯 Tu camino a la libertad';
tx='Este círculo muestra cuánto de tus deudas ya pagaste. Cada pago que se aplica lo llena un poco más, hasta llegar al 100%.';
if(!S.debts.length){em='🌱';mo='Agrega tus deudas para empezar a ver tu avance.'}
else if(tot==0){em='🥳';mo='¡Libre de deudas! Lo lograste.'}
else if(dp==0){em='😟';mo='Aún no empieza a llenarse, pero ya diste el primer paso: mirar tus deudas de frente.'}
else if(dp<50){em='🙂';mo='Ya empezó a avanzar. Cada pago cuenta.'}
else{em='😄';mo='Más de la mitad. ¡Ya casi!'}}
else if(sheet=='apartados'){em='🐷';ti='📌 Apartados del mes';
tx='Cada vez que repartes un ingreso, una parte del alquiler y de tus cuotas se aparta para juntarlas y pagar completo en su fecha. La app solo lleva la cuenta: aparta ese dinero de verdad, en un sobre o en otra cuenta, para no gastarlo por error.';
mo='Cuando lo pagues de verdad, toca "Ya lo pagué" y la barra vuelve a empezar.'}
else{em='⏸️';ti='⏸️ Gastos pausables';
tx='Son suscripciones y gastos fijos que no son esenciales. Si el dinero no alcanza, se pausan uno o dos meses para cubrir lo importante, y la app te avisa cuándo retomarlos.';
mo='Pausar no es perder: es cuidar lo importante primero.'}

function vForm(first){const o=(v,t,c)=>'<option value="'+v+'"'+(c==v?' selected':'')+'>'+t+'</option>';
return (first?'<h2>👋 ¡Bienvenido!</h2><p class="m">Vamos a configurar tu app. Son solo unos datos. Todo se guarda únicamente en tu teléfono y nadie más lo ve.</p>':'<h2>⚙️ Ajustes</h2>')+'<div class="card"><label>Tu nombre</label><input id="fn" value="'+esc(S.name)+'"><label>Eres</label><select id="fg">'+o('f','Mujer',S.g)+o('m','Hombre',S.g)+'</select><label>Símbolo de tu moneda (ej. $ o US$)</label><input id="fc" value="'+esc(S.cur)+'"><label>¿A qué te dedicas?</label><select id="fj">'+o('delivery','Delivery / reparto',S.job)+o('empleado','Empleado',S.job)+o('independiente','Independiente',S.job)+o('otro','Otro',S.job)+'</select><label>Tu ingreso es</label><select id="fi">'+o('variable','Variable (cambia cada vez)',S.inc)+o('fijo','Fijo (sueldo)',S.inc)+'</select><label>Si es fijo: ¿cuánto recibes al mes?</label><input id="fs" type="number" inputmode="decimal" value="'+(S.sal||'')+'"><label>¿Cada cuánto registras tus ingresos?</label><select id="ff">'+o('semanal','Cada semana',S.freq)+o('quincenal','Cada quincena',S.freq)+o('mensual','Cada mes',S.freq)+'</select>'+(first?'':'<label>Método para el dinero extra</label><select id="fm">'+o('bola','Bola de nieve (la deuda más pequeña primero)',S.method)+o('av','Avalancha (la de más interés primero)',S.method)+'</select><label>% del sobrante para diversión (máx. 30)</label><input id="fu" type="number" value="'+S.fun+'"><label>Modo avanzado (horas trabajadas y gasto de trabajo)</label><select id="fd">'+o('0','Apagado',S.adv?'1':'0')+o('1','Encendido',S.adv?'1':'0')+'</select>')+'</div><div class="card"><b>Tus gastos fijos al mes</b><br><br><label>Gastos de tu trabajo (gasolina, herramientas, transporte para ir a trabajar)</label><input id="fk" type="number" inputmode="decimal" value="'+S.fix.trabajo+'"><label>Comida y servicios básicos (mercado, luz, agua, internet)</label><input id="fb" type="number" inputmode="decimal" value="'+S.fix.basicos+'"><label>Alquiler</label><input id="fa" type="number" inputmode="decimal" value="'+S.fix.alquiler+'"><label>Día del mes en que pagas el alquiler (opcional)</label><input id="fr" type="number" inputmode="numeric" value="'+(S.rentDay||'')+'"></div><button class="b" onclick="saveForm('+first+')">'+(first?'Empezar':'Guardar')+'</button>'+(first?'':'<button class="b g" onclick="resetAll()">Borrar todos mis datos</button>')}

function confetti(){const c=['#6c4cf1','#4c8df6','#17a673','#f5a524','#e0559e'];
for(let i=0;i<46;i++){const e=document.createElement('span');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDuration=(1.8+Math.random()*1.6)+'s';e.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4300)}}
function countUp(){if(RM)return;document.querySelectorAll('[data-v]').forEach(el=>{const v=+el.dataset.v;let s=null;
const st=ts=>{if(!s)s=ts;const p=Math.min(1,(ts-s)/800);el.textContent=fr(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}

function render(keep){const nav=document.getElementById('nav');
if(!S.setup){document.getElementById('app').innerHTML=vForm(true);nav.innerHTML='';return}
document.getElementById('app').innerHTML={inicio:vInicio,deudas:vDeudas,ingreso:vIngreso,extra:vExtra,imp:vImp,atraso:vAtraso,hist:vHist,ajustes:()=>vForm(false)}[tab]()+vSheet();
nav.innerHTML=[['inicio','🏠','Inicio'],['deudas','📋','Deudas'],['ingreso','💰','Ingreso'],['extra','🎁','Extra'],['ajustes','⚙️','Ajustes']].map(t=>'<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span><span>'+t[2]+'</span></button>').join('');
if(!keep)window.scrollTo(0,0);
countUp();
if(boom){boom=false;if(!RM)confetti()}}
render();
